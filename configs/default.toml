# Default run configuration. Every value here is logged with each run.
# Amplitude: target = measured_start + scale * (recorded - measured_start)
#   scale 0 holds the measured starting value, 1 requests the recorded value.

[scales]
arms = 1.0
waist_yaw = 1.0
waist_roll = 1.0
waist_pitch = 1.0

[speed]
speed = 1.0          # playback rate; amplitude is unaffected
segments = []        # [[t0, t1, factor], ...] in dance seconds, e.g. [[8.0, 11.0, 0.5]]
blend_s = 0.4
ramp_in_s = 0.0     # >0 eases playback start (frame 0 is mid-motion); time warp only

[gains]
# Arms: Unitree's g1_arm7_sdk_dds_example uses kp=60, kd=1.5. On hardware
# (2026-11-20) kp=60 let the raised right arm sag 7.60 deg below the opening
# pose and the entry gate stopped the run; kp=120 / kd=3.0 measured 3.86 deg
# (sim-scaled prediction 3.80) and passed. configs/sdk_example_gains.toml keeps 60.
kp_arm = 120.0
kd_arm = 3.0
# Waist: the same example uses kp=60 for the waist too. Hardware history
# (2026-11-20): kp=60 (earlier code) -> waist 20.8 deg vs 6.9 deg commanded;
# kp=300 -> opening pose 9.42 vs 7.38 deg, playback lag 212 ms (with dq ff);
# kp=400/kd=10 -> lag 163 ms, offset 1.86 deg, playback error 3.44 deg (0-5 s
# at 0.5x), no oscillation. configs/sdk_example_gains.toml keeps kp=60.
kp_waist = 400.0
kd_waist = 10.0
# Send the commanded velocity in motor_cmd.dq (Unitree's example sends 0).
# Hardware A/B 2026-11-20, dance 0-5 s at 0.5x: waist lag 241 -> 212 ms, right
# elbow lag 60 -> 40 ms / RMS 1.27 -> 0.89 deg, no added oscillation.
dq_feedforward = true

[limits]
pos_margin = 0.05     # rad inside URDF range
vel_arm = 3.0         # rad/s command-rate cap
vel_wrist_pitch_yaw = 3.0
vel_waist = 0.6

[gates]
entry_cmd_tol = 1e-6
entry_meas_tol_arm = 0.10
entry_meas_tol_waist = 0.05
track_arm = 0.35
track_waist_yaw = 0.15
track_waist_roll = 0.10
track_waist_pitch = 0.10
waist_pitch_abs = 0.30
waist_roll_abs = 0.25
imu_pitch_delta = 0.12
imu_roll_delta = 0.10
joint_speed = 6.0
state_timeout_s = 0.10
